services:
  - type: web
    name: sajilomarts-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 000
      - key: INDIA_NPR_CONVERSION_RATE
        value: "1.65"
      - key: SERVICE_CHARGE_PERCENT
        value: "20"
      - key: DELIVERY_CHARGE_NPR
        value: "200"
      # The following secrets MUST be set via Render Dashboard → Environment
      # (not committed to Git):
      # MONGODB_URI
      # MONGO_URI
      # ADMIN_EMAIL
      # ADMIN_PASSWORD
      # JWT_SECRET
      # GEMINI_API_KEY
      # SMTP_USER
      # SMTP_PASS
      # GOOGLE_CLIENT_ID
      # GOOGLE_CLIENT_SECRET
      # FIREBASE_PROJECT_ID
      # FIREBASE_CLIENT_EMAIL
      # FIREBASE_PRIVATE_KEY
      # KHALTI_SECRET_KEY
      # ESEWA_SECRET_KEY
      # FRONTEND_URL
